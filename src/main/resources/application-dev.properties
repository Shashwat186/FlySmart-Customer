# Dev profile: activate with -Dspring-boot.run.profiles=dev (Maven) or SPRING_PROFILES_ACTIVE=dev.

# Verbose application logging
logging.level.smart.fly=DEBUG

# Log the SQL executed through JdbcTemplate and connection handling
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.datasource.DataSourceUtils=DEBUG

# Also write logs to a file (rolled daily / at 10MB, kept for 7 days)
logging.file.name=logs/flysmart-dev.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
